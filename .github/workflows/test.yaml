name: Run Tests

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    name: Run pytest against Polypheny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout a Prism 2.2 server
        uses: actions/checkout@v4
        with:
          repository: polypheny/Polypheny-DB
          ref: 3a9d8db78c39a6a7cc5ce57fcd248c6cdaa62a36
          path: polypheny-db
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install PolyNOM and test dependencies
        run: python -m pip install '.[dev]'

      - name: Validate wheel and source distribution
        run: |
          python -m pip install 'build==1.6.1' 'twine==7.0.0'
          python -m build
          python -m twine check --strict dist/*

      - name: Build executable server and plugins
        working-directory: polypheny-db
        run: ./gradlew :dbms:shadowJar assemblePlugins -PwithoutpullingUi=true --console=plain

      - name: Select executable server JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile

          candidates = [path for path in Path('polypheny-db/dbms/build/libs').glob('dbms-*.jar')
                        if not path.stem.endswith(('-tests', '-sources', '-javadoc'))]
          assert len(candidates) == 1, f'Expected one executable JAR, found {candidates}'
          with zipfile.ZipFile(candidates[0]) as jar:
              assert 'org/slf4j/Logger.class' in jar.namelist(), 'Server JAR lacks runtime dependencies'
          shutil.copyfile(candidates[0], 'polypheny.jar')
          PY

      - name: Run tests
        uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
        with:
          cmd: python -m pytest tests
          jar: polypheny.jar
          autodocker: false
